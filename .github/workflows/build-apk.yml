name: Build AutoLog APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract AutoLog project
        run: |
          unzip -q AutoLog-Full-APK-Ready.zip
          echo "Extracted files:"
          find . -maxdepth 3 -type f | head -100

      - name: Find project directory
        run: |
          PROJECT_DIR=$(find . -name package.json -not -path './node_modules/*' -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLog-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
